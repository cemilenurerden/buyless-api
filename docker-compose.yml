services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: buyless
      POSTGRES_PASSWORD: buyless123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: buyless
      RABBITMQ_DEFAULT_PASS: buyless123

  auth-service:
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_auth;Username=buyless;Password=buyless123

  inventory-service:
    build:
      context: .
      dockerfile: src/Services/InventoryService/InventoryService.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_inventory;Username=buyless;Password=buyless123

  budget-service:
    build:
      context: .
      dockerfile: src/Services/BudgetService/BudgetService.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_budget;Username=buyless;Password=buyless123

  donation-service:
    build:
      context: .
      dockerfile: src/Services/DonationService/DonationService.API/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_donation;Username=buyless;Password=buyless123

  reward-service:
    build:
      context: .
      dockerfile: src/Services/RewardService/RewardService.API/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_reward;Username=buyless;Password=buyless123

  marketplace-service:
    build:
      context: .
      dockerfile: src/Services/MarketplaceService/MarketplaceService.API/Dockerfile
    ports:
      - "5006:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_marketplace;Username=buyless;Password=buyless123

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.API/Dockerfile
    ports:
      - "5007:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=buyless_notification;Username=buyless;Password=buyless123

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/BuyLess.ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - auth-service
      - inventory-service
      - budget-service
      - donation-service
      - reward-service
      - marketplace-service
      - notification-service

volumes:
  postgres_data:
